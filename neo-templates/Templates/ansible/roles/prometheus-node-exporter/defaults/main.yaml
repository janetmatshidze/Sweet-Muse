node_exporter_state: present
node_exporter_version: latest
node_exporter_architecture: amd64
node_exporter_download_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_architecture }}.tar.gz"
node_exporter_binary_path: /opt/node_exporter
node_exporter_textfile_path: /var/lib/node_exporter/textfile_collector
node_exporter_custom_metrics_scripts: []

# Custom Metrics Scripts Sample:
# node_exporter_custom_metrics_scripts:
#   - script: ./templates/collect_metrics.sh
#     interval: "*/2 * * * *"  # Every 2 minutes

node_exporter_group: node_exporter
node_exporter_user: node_exporter
node_exporter_web_listen_address: "0.0.0.0"
node_exporter_listen_port: 9100
node_exporter_add_ufw_allow_rule: false

# Runtime flags example. This would enable the systemd collector, but only for the SSH service
# (Regex can be used to pattern match the service name)
# node_exporter_runtime_flags:
#   - "--collector.systemd"
#   - "--collector.systemd.unit-include=ssh.service"
