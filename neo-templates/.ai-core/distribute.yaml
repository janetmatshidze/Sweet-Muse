  - .github/instructions/frontend-instructions/**/*.*
  - .github/instructions/authentication-authorization-backend.instructions.md
  - .github/instructions/catalogue-backend.instructions.md
  - .github/instructions/exception-handling.instructions.md
  - .github/instructions/logging.instructions.md
  - .github/instructions/project.instructions.md
  - .github/instructions/sql.instructions.md
RemoveExclude:
  - .github/copilot-instructions.md