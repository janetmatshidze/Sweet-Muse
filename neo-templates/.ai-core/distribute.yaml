# yaml-language-server: $schema=https://files.singular-devops.com/schemas/ai-core/v1/distribute-v1.0.0.json

CreateInclude:
  - .github/instructions/project/*.instructions.md
UpdateInclude:
  - .ai-core/agents/**/*.md
  - .ai-core/checklists/**/*.md
  - .ai-core/commands/**/*.md
  - .ai-core/data/**/*.md
  - .ai-core/guides/**/*.md
  - .ai-core/scripts/**/*.*
  - .ai-core/shell/**/*.md
  - .ai-core/skills/**/*.*
  - .ai-core/standards/**/*.md
  - .ai-core/statusline/**/*.md
  - .ai-core/templates/**/*.md
  - .claude/CLAUDE.md
  - .claude/rules/**/*.md
  - .claude/skills/**/*.*
  - .github/agents/**/*.agent.md
  - .github/chatmodes/**/*.chatmode.md
  - .github/copilot-instructions.md
  - .github/instructions/**/*.instructions.md
  - .github/prompts/**/*.prompt.md
  - .github/skills/**/*.*
  - .github/workflows/copilot-setup-steps.yml
UpdateExclude:
  - .github/instructions/project/*.instructions.md
RemoveInclude:
